{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AutoLease{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="nav-container">
            <a class="brand" href="{% url 'home' %}">AutoLease</a>
            <nav aria-label="Primary navigation">
                <a class="nav-link" href="{% url 'home' %}">Explore</a>
                {% if user.is_authenticated %}
                    <span class="nav-user">Signed in as {{ user.email }}</span>
                {% else %}
                    <a class="nav-link" href="{% url 'accounts:register' %}">Sign up</a>
                    <a class="button button-small" href="{% url 'accounts:login' %}">Login</a>
                {% endif %}
            </nav>
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
